<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Assiston</title>
    <script src="/assets/lib/tailwind.js"></script>
    <script src="/assets/utils/base.js"></script>
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 
                            400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 
                            800: '#3730a3', 900: '#312e81',
                        }
                    }
                }
            }
        }

        async function handleRegister() {
            const firstName = document.getElementById('first_name').value;
            const lastName = document.getElementById('last_name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const terms = document.getElementById('terms').checked;
            const btn = document.getElementById('reg-btn');

            if (!terms) {
                alert("Please agree to the Terms of Service");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Creating...';

            try {
                const response = await fetch('http://localhost:5000/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name: `${firstName} ${lastName}`.trim(), 
                        email, 
                        password 
                    })
                });

                const data = await response.json();

                if (response.status === 201) {
                    window.location.href = 'login.html?registered=true';
                } else {
                    alert(data.error || "Registration failed");
                    btn.disabled = false;
                    btn.innerText = 'Create Free Account';
                }
            } catch (err) {
                alert("Connection error. Is the backend running?");
                btn.disabled = false;
                btn.innerText = 'Create Free Account';
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased transition-colors duration-300 dark:bg-slate-950 dark:text-slate-200 min-h-screen flex flex-col">

    <nav class="w-full bg-white/90 backdrop-blur-md border-b border-slate-200 z-50 dark:bg-slate-900/90 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex justify-between items-center h-16">
            <a href="index.html" class="text-xl font-bold text-indigo-600 flex items-center gap-2 dark:text-indigo-400">
                <i class="fas fa-comment-dots"></i> Assiston
            </a>
            <button id="theme-toggle" class="p-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:hover:bg-slate-700 transition-colors">
                <i class="fas fa-moon hidden" id="theme-icon-dark"></i>
                <i class="fas fa-sun" id="theme-icon-light"></i>
            </button>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 py-12">
        <div class="w-full max-w-md">
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden dark:bg-slate-900 dark:border-slate-800">
                <div class="p-8">
                    <div class="text-center mb-8">
                        <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white mb-2">Create an account</h1>
                        <p class="text-slate-500 dark:text-slate-400 text-sm">Start managing your support widgets today</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <button class="flex items-center justify-center gap-2 py-2.5 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors dark:border-slate-700 dark:hover:bg-slate-800">
                            <i class="fab fa-github"></i> <span class="text-sm font-medium">GitHub</span>
                        </button>
                        <button class="flex items-center justify-center gap-2 py-2.5 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors dark:border-slate-700 dark:hover:bg-slate-800">
                            <i class="fab fa-google"></i> <span class="text-sm font-medium">Google</span>
                        </button>
                    </div>

                    <div class="relative mb-8">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
                        </div>
                        <div class="relative flex justify-center text-xs uppercase">
                            <span class="bg-white px-2 text-slate-500 dark:bg-slate-900 dark:text-slate-400">Or use email</span>
                        </div>
                    </div>

                    <form class="space-y-5" onsubmit="event.preventDefault(); handleRegister();">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">First Name</label>
                                <input type="text" id="first_name" placeholder="Jane" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all dark:bg-slate-950 dark:border-slate-700 dark:text-white">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Last Name</label>
                                <input type="text" id="last_name" placeholder="Doe" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all dark:bg-slate-950 dark:border-slate-700 dark:text-white">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Email Address</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                    <i class="fas fa-envelope"></i>
                                </span>
                                <input type="email" id="email" placeholder="jane@company.com" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all dark:bg-slate-950 dark:border-slate-700 dark:text-white">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" id="password" placeholder="Min. 8 characters" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all dark:bg-slate-950 dark:border-slate-700 dark:text-white">
                            </div>
                        </div>

                        <div class="flex items-start">
                            <input type="checkbox" id="terms" class="mt-1 w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 dark:bg-slate-800 dark:border-slate-700">
                            <label for="terms" class="ml-2 text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                                By signing up, I agree to the <a href="#" class="text-indigo-600 hover:underline">Terms of Service</a> and <a href="#" class="text-indigo-600 hover:underline">Privacy Policy</a>.
                            </label>
                        </div>

                        <button type="submit" id="reg-btn" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-lg shadow-indigo-500/20 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
                            Create Free Account
                        </button>
                    </form>
                </div>
                
                <div class="px-8 py-4 bg-slate-50 border-t border-slate-200 text-center dark:bg-slate-800/50 dark:border-slate-800">
                    <p class="text-sm text-slate-600 dark:text-slate-400">
                        Already have an account? <a href="login.html" class="font-bold text-indigo-600 hover:text-indigo-500 dark:text-indigo-400">Log in</a>
                    </p>
                </div>
            </div>
            
            <p class="mt-8 text-center text-xs text-slate-500 dark:text-slate-500">
                &copy; 2024 Assiston.io &bull; <a href="#" class="hover:underline">Security</a> &bull; <a href="#" class="hover:underline">Contact</a>
            </p>
        </div>
    </main>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const iconDark = document.getElementById('theme-icon-dark');
        const iconLight = document.getElementById('theme-icon-light');

        const updateIcons = (isDark) => {
            iconDark.classList.toggle('hidden', isDark);
            iconLight.classList.toggle('hidden', !isDark);
        };

        updateIcons(document.documentElement.classList.contains('dark'));

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            updateIcons(isDark);
        });
    </script>
</body>
</html>
