<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Assiston</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 950: '#020617' },
                        brand: { 600: '#2563eb', 700: '#1d4ed8' }
                    },
                    borderRadius: {
                        'none': '0',
                        'sm': '2px',
                        DEFAULT: '4px',
                        'md': '4px',
                        'lg': '4px',
                        'xl': '4px',
                        '2xl': '4px',
                    }
                }
            }
        }
    </script>
    <style>
        .sidebar-item-active { background: #f1f5f9; color: #0f172a !important; border-right: 3px solid #2563eb; }
        .dark .sidebar-item-active { background: #1e293b; color: #f8fafc !important; border-right: 3px solid #3b82f6; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 0; }
        #mobile-sidebar { transition: transform 0.2s ease-in-out; }
        @media (max-width: 1023.9px) {
            .mobile-sidebar-open #mobile-sidebar { transform: translateX(0); }
            .mobile-sidebar-closed #mobile-sidebar { transform: translateX(-100%); }
        }
        .rounded-card { border-radius: 2px; }
        .rounded-btn { border-radius: 2px; }
        .rounded-input { border-radius: 2px; }
        .highlight-entry { animation: flash 2s ease-out; }
        @keyframes flash {
            0% { background-color: rgba(37, 99, 235, 0.1); }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased mobile-sidebar-closed h-screen overflow-hidden">

    <div id="toast-container" class="fixed top-6 right-6 z-[200] space-y-2 pointer-events-none"></div>
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] hidden lg:hidden" onclick="toggleMobileMenu()"></div>

    <div class="flex h-full w-full">
        <aside id="mobile-sidebar" class="fixed inset-y-0 left-0 w-64 bg-white dark:bg-slate-900 z-[70] flex flex-col border-r border-slate-200 dark:border-slate-800 lg:static lg:translate-x-0 flex-shrink-0">
            <div class="h-16 flex items-center px-6 border-b border-slate-100 dark:border-slate-800">
                <div class="flex items-center gap-2 font-bold text-lg tracking-tight text-slate-900 dark:text-white">
                    <i class="fa-solid fa-square-poll-vertical text-brand-600"></i>
                    <span>Assiston</span>
                </div>
            </div>
            
            <div class="flex-grow py-2 overflow-y-auto custom-scrollbar">
                <nav class="space-y-0.5">
                    <button onclick="showTab('overview')" class="nav-item sidebar-item-active w-full flex items-center gap-3 px-6 py-2.5 text-sm font-medium transition-colors text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800">
                        <i class="fa-solid fa-chart-line w-5"></i> Overview
                    </button>
                    <button onclick="showTab('widgets')" class="nav-item w-full flex items-center gap-3 px-6 py-2.5 text-sm font-medium transition-colors text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800">
                        <i class="fa-solid fa-puzzle-piece w-5"></i> Widgets
                    </button>
                    <button onclick="showTab('inbox')" class="nav-item w-full flex items-center gap-3 px-6 py-2.5 text-sm font-medium transition-colors text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800">
                        <i class="fa-solid fa-envelope-open-text w-5"></i> Inbox
                        <span class="ml-auto bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 px-1.5 py-0.5 rounded-sm text-[10px]" id="inbox-badge">0</span>
                    </button>
                    <button onclick="showTab('team')" class="nav-item w-full flex items-center gap-3 px-6 py-2.5 text-sm font-medium transition-colors text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800">
                        <i class="fa-solid fa-users w-5"></i> Team
                    </button>
                </nav>
            </div>

            <div class="p-4 border-t border-slate-100 dark:border-slate-800">
                <div class="flex items-center gap-3 p-2 rounded-sm bg-slate-50 dark:bg-slate-800/50">
                    <div class="w-7 h-7 rounded-sm bg-brand-600 flex items-center justify-center text-white text-[10px] font-bold">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="min-w-0 flex-grow">
                        <p class="text-[11px] font-bold truncate leading-tight" id="user-name">User</p>
                        <button onclick="logout()" class="text-[9px] text-slate-500 hover:text-red-500 font-bold uppercase tracking-tighter">Sign out</button>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-grow flex flex-col min-w-0 h-full overflow-hidden">
            <header class="h-16 flex items-center justify-between px-6 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shrink-0">
                <div class="flex items-center gap-4">
                    <button onclick="toggleMobileMenu()" class="lg:hidden p-2 text-slate-500">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <h1 class="text-xs font-bold text-slate-400 uppercase tracking-[0.15em]" id="page-title">Overview</h1>
                </div>
            </header>

            <div class="flex-grow overflow-y-auto custom-scrollbar p-6">
                <div class="max-w-[1600px] mx-auto space-y-6">
                    
                    <div id="overview-content" class="tab-content space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="bg-white dark:bg-slate-900 p-4 rounded-card border border-slate-200 dark:border-slate-800 shadow-sm">
                                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">Active Widgets</p>
                                <h2 class="text-xl font-bold" id="stat-widgets">0</h2>
                            </div>
                            <div class="bg-white dark:bg-slate-900 p-4 rounded-card border border-slate-200 dark:border-slate-800 shadow-sm">
                                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">Total Submissions</p>
                                <h2 class="text-xl font-bold" id="stat-requests">0</h2>
                            </div>
                            <div class="bg-white dark:bg-slate-900 p-4 rounded-card border border-slate-200 dark:border-slate-800 shadow-sm">
                                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">Conversion Rate</p>
                                <h2 class="text-xl font-bold">--</h2>
                            </div>
                            <div class="bg-white dark:bg-slate-900 p-4 rounded-card border border-slate-200 dark:border-slate-800 shadow-sm">
                                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">API Port</p>
                                <h2 class="text-sm font-bold text-emerald-500 uppercase">5000 / Active</h2>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                            <div class="xl:col-span-2 space-y-4">
                                <div class="flex items-center justify-between px-1">
                                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Your Widgets</h3>
                                    <button onclick="showTab('widgets')" class="text-[10px] font-bold text-brand-600 hover:underline">VIEW ALL</button>
                                </div>
                                <div id="widgets-grid-overview" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                            </div>
                            <div class="space-y-4">
                                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest px-1">Recent Activity</h3>
                                <div id="recent-requests-overview" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-card divide-y dark:divide-slate-800 shadow-sm overflow-hidden h-[420px]"></div>
                            </div>
                        </div>
                    </div>

                    <div id="widgets-content" class="tab-content hidden space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="text-lg font-bold">Integrations</h2>
                            <button onclick="openModal('newWidgetModal')" class="px-3 py-1.5 bg-slate-900 dark:bg-brand-600 text-white rounded-btn text-[11px] font-bold uppercase tracking-wider hover:bg-slate-800">
                                <i class="fa-solid fa-plus mr-1.5"></i> Add New
                            </button>
                        </div>
                        <div id="full-widgets-list" class="grid grid-cols-1 gap-2"></div>
                    </div>

                    <div id="inbox-content" class="tab-content hidden space-y-4">
                        <h2 class="text-lg font-bold">Submissions</h2>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-card overflow-hidden shadow-sm">
                            <div id="inbox-list" class="divide-y dark:divide-slate-800"></div>
                        </div>
                    </div>

                    <div id="team-content" class="tab-content hidden">
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-card p-12 text-center max-w-xl mx-auto">
                            <i class="fa-solid fa-user-gear text-3xl text-slate-200 mb-4"></i>
                            <h2 class="text-md font-bold mb-1">Manage Team</h2>
                            <p class="text-slate-400 text-xs mb-6">Invite collaborators to manage your customer interactions.</p>
                            <button class="px-4 py-2 bg-slate-900 text-white text-[10px] font-bold rounded-btn uppercase tracking-widest">Invite Member</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="newWidgetModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-950/40 backdrop-blur-sm" onclick="closeModal('newWidgetModal')"></div>
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-card relative z-10 shadow-2xl p-6 border dark:border-slate-800">
            <h2 class="text-md font-bold mb-4">New Widget</h2>
            <form id="new_widget_form" class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Label</label>
                    <input type="text" id="wid-name" required placeholder="Production Site" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-input py-2 px-3 text-xs focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Domain</label>
                    <input type="url" id="wid-site" required placeholder="https://example.com" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-input py-2 px-3 text-xs focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Brand Color</label>
                    <input type="color" id="wid-color" value="#2563eb" class="w-full h-8 rounded-input bg-slate-50 dark:bg-slate-800 p-0.5 cursor-pointer border border-slate-200 dark:border-slate-700">
                </div>
                <button type="submit" class="w-full py-2 bg-brand-600 text-white text-[10px] font-bold rounded-btn uppercase tracking-widest">Create</button>
            </form>
        </div>
    </div>

    <div id="settingsModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-950/40 backdrop-blur-sm" onclick="closeModal('settingsModal')"></div>
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-card relative z-10 shadow-2xl p-6 border dark:border-slate-800">
            <h2 class="text-md font-bold mb-4">Edit Configuration</h2>
            <div id="settings-form-container"></div>
        </div>
    </div>

    <script src="/assets/utils/base.js"></script>
    <script>
        
        let currentWidgets = [];
        let currentRequests = [];

        function showToast(message, success = true) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 px-3 py-2 rounded-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-md pointer-events-auto transform transition-all duration-300`;
            const icon = success ? 'fa-circle-check text-emerald-500' : 'fa-circle-exclamation text-red-500';
            toast.innerHTML = `<i class="fa-solid ${icon} text-xs"></i><span class="text-[11px] font-bold uppercase tracking-tight">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 2500);
        }

        function toggleMobileMenu() {
            const body = document.body;
            const overlay = document.getElementById('sidebar-overlay');
            if (body.classList.contains('mobile-sidebar-closed')) {
                body.classList.replace('mobile-sidebar-closed', 'mobile-sidebar-open');
                overlay.classList.remove('hidden');
            } else {
                body.classList.replace('mobile-sidebar-open', 'mobile-sidebar-closed');
                overlay.classList.add('hidden');
            }
        }

        function showTab(tabId, targetId = null) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(`${tabId}-content`).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('sidebar-item-active'));
            document.querySelectorAll(`[onclick="showTab('${tabId}')"]`).forEach(nav => nav.classList.add('sidebar-item-active'));
            document.getElementById('page-title').innerText = tabId;
            
            if (targetId) {
                setTimeout(() => {
                    const el = document.getElementById(`req-${targetId}`);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.classList.add('highlight-entry');
                        setTimeout(() => el.classList.remove('highlight-entry'), 3000);
                    }
                }, 100);
            }

            if (window.innerWidth < 1024 && document.body.classList.contains('mobile-sidebar-open')) toggleMobileMenu();
        }

        async function loadDashboardData() {
            const token = getCookie('token');
            const user = getUser();
            if (!token || !user) return;
            document.getElementById('user-name').innerText = user.name || 'User';
            try {
                const wRes = await fetch(`${API_BASE}/api/widgets?uid=${user.id}&token=${token}`);
                currentWidgets = await wRes.json();
                renderWidgets();
                renderWidgetsList();
                let allReqs = [];
                for (const w of currentWidgets) {
                    const rRes = await fetch(`${API_BASE}/api/requests/${w.id}?token=${token}&uid=${user.id}`);
                    const data = await rRes.json();
                    allReqs = [...allReqs, ...data];
                }
                currentRequests = allReqs.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderRecentRequests();
                renderInbox();
                updateStats();
            } catch (err) { console.error(err); }
        }

        function updateStats() {
            document.getElementById('stat-widgets').innerText = currentWidgets.length;
            document.getElementById('stat-requests').innerText = currentRequests.length;
            document.getElementById('inbox-badge').innerText = currentRequests.length;
        }

        function renderWidgets() {
            const grid = document.getElementById('widgets-grid-overview');
            if (!currentWidgets.length) {
                grid.innerHTML = '<div class="col-span-full py-8 text-center text-slate-400 border border-dashed rounded-card text-[10px] uppercase font-bold">Waiting for first widget</div>';
                return;
            }
            grid.innerHTML = currentWidgets.slice(0, 6).map(w => `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-card p-4 shadow-sm">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-8 h-8 rounded-sm bg-slate-50 dark:bg-slate-800 flex items-center justify-center text-md" style="color: ${w.color}">
                            <i class="fa-solid fa-cube"></i>
                        </div>
                        <div class="min-w-0">
                            <h3 class="font-bold truncate text-xs leading-tight">${w.name}</h3>
                            <p class="text-[9px] text-slate-400 truncate uppercase tracking-tighter">${w.domain || 'All Domains'}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="copyScript('${w.id}')" class="flex-grow py-1.5 bg-slate-900 dark:bg-slate-800 text-[9px] font-bold text-white rounded-btn uppercase tracking-widest">Snippet</button>
                        <button onclick="openSettings('${w.id}')" class="w-7 h-7 rounded-btn bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 hover:text-brand-600">
                            <i class="fa-solid fa-gear text-[15px]"></i>
                        </button>
                        <button onclick="openInbox('${w.id}')" class=" p-2 bg-green-400 dark:bg-green-100 text-[9px] font-bold text-white rounded-btn uppercase tracking-widest"><i class="fas fa-message"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function renderRecentRequests() {
            const container = document.getElementById('recent-requests-overview');
            if (!currentRequests.length) {
                container.innerHTML = '<div class="flex items-center justify-center h-full text-slate-300 text-[10px] font-bold uppercase tracking-widest">No Activity Yet</div>';
                return;
            }
            container.innerHTML = currentRequests.slice(0, 10).map(r => `
                <div class="flex items-center justify-between p-3 hover:bg-slate-50 dark:hover:bg-slate-800/40 cursor-pointer" onclick="showTab('inbox', '${r.id}')">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-7 h-7 rounded-sm bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-[9px] font-bold shrink-0">
                            ${r.email.charAt(0).toUpperCase()}
                        </div>
                        <div class="min-w-0">
                            <p class="text-[11px] font-bold truncate">${r.email}</p>
                            <p class="text-[10px] text-slate-400 truncate">${r.message}</p>
                        </div>
                    </div>
                    <span class="text-[8px] font-bold uppercase px-1.5 py-0.5 rounded-sm bg-slate-100 text-slate-500">${r.status}</span>
                </div>
            `).join('');
        }
        function openInbox(id){
            if(id){
                window.open('/inbox/?id=' + id)
            }
        }

        function renderInbox() {
            const container = document.getElementById('inbox-list');
            if (!currentRequests.length) {
                container.innerHTML = '<div class="p-16 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Inbox is empty</div>';
                return;
            }
            container.innerHTML = currentRequests.map(r => `
                <div id="req-${r.id}" class="p-4 flex items-center justify-between gap-6 hover:bg-slate-50 dark:hover:bg-slate-800/30 cursor-pointer border-l-2 border-transparent">
                    <div class="flex gap-4 min-w-0">
                        <div class="w-9 h-9 rounded-sm bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold text-xs shrink-0">${r.email.charAt(0).toUpperCase()}</div>
                        <div class="min-w-0">
                            <div class="flex items-center gap-2 mb-0.5">
                                <p class="text-[13px] font-bold">${r.email}</p>
                                <span class="text-[9px] text-slate-400 font-medium">${r.date}</span>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-400 truncate max-w-xl">${r.message}</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-angle-right text-slate-300 text-xs"></i>
                </div>
            `).join('');
        }

        function renderWidgetsList() {
            const container = document.getElementById('full-widgets-list');
            container.innerHTML = currentWidgets.map(w => `
                <div class="flex items-center justify-between p-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-card shadow-sm hover:border-slate-300 transition-colors">
                    <div class="flex items-center gap-4">
                        <div class="w-1 h-8 rounded-full" style="background: ${w.color}"></div>
                        <div>
                            <p class="font-bold text-xs leading-tight">${w.name}</p>
                            <p class="text-[9px] text-slate-400 font-medium uppercase tracking-tighter">${w.domain || 'Global'}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="copyScript('${w.id}')" class="px-3 py-1.5 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-[10px] font-bold rounded-btn uppercase tracking-widest hover:bg-slate-100">
                             Copy ID
                        </button>
                        <button onclick="openSettings('${w.id}')" class="w-8 h-8 flex items-center justify-center bg-slate-50 dark:bg-slate-800 rounded-btn text-slate-400 hover:text-brand-600">
                             <i class="fa-solid fa-sliders text-[11px]"></i>
                        </button>
                        <button onclick="openInbox('${w.id}')" class="w-8 h-8 flex items-center justify-center bg-slate-50 dark:bg-slate-800 rounded-btn text-slate-400 hover:text-brand-600">
                             <i class="fa-solid fa-message text-[11px]"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function copyScript(id) {
            const script = `<script src="${API_BASE}" data-token="${id}" id="assiston-script"></scr` + `ipt>`;
            const el = document.createElement('textarea');
            el.value = script;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast('Copied to clipboard');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.remove('flex'); document.getElementById(id).classList.add('hidden'); }

        function openSettings(id) {
            const widget = currentWidgets.find(w => w.id === id);
            if(!widget) return;
            const container = document.getElementById('settings-form-container');
            container.innerHTML = `
                <form id="edit_widget_form" class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Label</label>
                        <input type="text" id="edit-name" value="${widget.name}" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-input py-2 px-3 text-xs focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Domain</label>
                        <input type="url" id="edit-site" value="${widget.domain}" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-input py-2 px-3 text-xs focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Brand Color</label>
                        <input type="color" id="edit-color" value="${widget.color}" class="w-full h-8 rounded-input bg-slate-50 dark:bg-slate-800 p-0.5 cursor-pointer border border-slate-200 dark:border-slate-700">
                    </div>
                    <div class="pt-4 flex gap-2">
                        <button type="button" onclick="deleteWidget('${id}')" class="px-4 py-2 border border-red-100 text-red-500 text-[10px] font-bold rounded-btn uppercase tracking-widest hover:bg-red-50">
                            Delete
                        </button>
                        <button type="submit" class="flex-grow py-2 bg-brand-600 text-white text-[10px] font-bold rounded-btn uppercase tracking-widest shadow-sm">
                            Save Changes
                        </button>
                    </div>
                </form>
            `;
            document.getElementById('edit_widget_form').onsubmit = (e) => { e.preventDefault(); handleWidgetUpdate(id); };
            openModal('settingsModal');
        }

        async function handleWidgetUpdate(id) {
            const token = getCookie('token');
            const user = getUser();
            const payload = {
                id,
                name: document.getElementById('edit-name').value,
                domain: document.getElementById('edit-site').value,
                color: document.getElementById('edit-color').value,
                token: token,
                owner_id: user.id
            };
            try {
                const res = await fetch(`${API_BASE}/api/widgets/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    showToast('Configuration Updated');
                    closeModal('settingsModal');
                    loadDashboardData();
                }
            } catch(err) { showToast('Sync Error', false); }
        }

        async function deleteWidget(id) {
            if(!confirm('Permanently remove this widget?')) return;
            const token = getCookie('token');
            try {
                const res = await fetch(`${API_BASE}/api/widgets/${id}?token=${token}`, { method: 'DELETE' });
                if(res.ok) {
                    showToast('Widget Removed');
                    closeModal('settingsModal');
                    loadDashboardData();
                }
            } catch(err) { showToast('Error', false); }
        }

        function logout() {
            document.cookie = "token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            document.cookie = "user=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.reload();
        }

        document.getElementById('new_widget_form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = getUser();
            const token = getCookie('token');
            const payload = {
                name: document.getElementById('wid-name').value,
                domain: document.getElementById('wid-site').value,
                color: document.getElementById('wid-color').value,
                owner_id: user?.id,
                token: token
            };
            try {
                const res = await fetch(`${API_BASE}/api/widgets`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    showToast('Widget Created');
                    closeModal('newWidgetModal');
                    loadDashboardData();
                }
            } catch (err) { showToast('Error', false); }
        });

        window.onload = loadDashboardData;
    </script>
</body>
</html>
